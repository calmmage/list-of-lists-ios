name: ListOfLists
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: 5.0
  CODE_SIGN_STYLE: Automatic
targets:
  ListOfLists:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.calmmage.listoflists
      TARGETED_DEVICE_FAMILY: "1"
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: List of Lists
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ListOfListsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ListOfLists
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.calmmage.listoflists.uitests
schemes:
  ListOfLists:
    build:
      targets:
        ListOfLists: all
    test:
      targets: [ListOfListsUITests]
