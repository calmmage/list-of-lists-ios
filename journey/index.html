<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>List of Lists · iPhone walkthrough</title>
<style>
:root {color-scheme: light dark; font: 16px/1.45 system-ui, sans-serif;}
body {max-width: 72rem; margin: auto; padding: clamp(1rem, 4vw, 3rem);}
h1 {margin: 0; font-size: 2rem;} header p {margin-top: .35rem;}
main {display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,13rem),1fr)); gap: 1.25rem; margin-top: 1.8rem;}
figure {margin: 0;} img {width: 100%; border-radius: 1rem; display: block;}
h2 {font-size: 1.08rem; margin: .9rem 0 .25rem;} figcaption p {margin: 0;}
</style>
<header><h1>List of Lists</h1><p>One directory, one page per list. Screens captured in the iPhone simulator.</p></header>
<main>
<figure><a href="empty.png"><img src="empty.png" alt="Empty directory with an Add list button"></a><figcaption><h2>Create a list</h2><p>Tap <b>Add list</b>, give it a name, and tap <b>Add</b>.</p></figcaption></figure>
<figure><a href="items.png"><img src="items.png" alt="Weekend containing two activities"></a><figcaption><h2>Fill it with items</h2><p>Open Weekend and tap <b>Add item</b>. Each title gets a row.</p></figcaption></figure>
<figure><a href="pages.png"><img src="pages.png" alt="Page menu with Weekend selected, the directory starred, and Books below it"></a><figcaption><h2>Switch lists</h2><p>Tap the menu and choose Books. The star marks the directory.</p></figcaption></figure>
<figure><a href="directory.png"><img src="directory.png" alt="Directory with an item count under each list"></a><figcaption><h2>Come back later</h2><p>Reopen the app. Both lists are in the directory, each with its own items.</p></figcaption></figure>
</main>
</html>
